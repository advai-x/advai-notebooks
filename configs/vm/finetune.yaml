# First train smoke.yaml, then reuse its export on new data with identical semantics.
# Preserve the original training normalization to preserve the base model's meaning.
output_dir: outputs/vm/finetune
model:
  id: outputs/vm/smoke/export
  observation_dim: 2
  action_dim: 2
  hidden_size: 32
  horizon: 3
  predict_delta: true
data:
  samples: data/sample/vm/episodes.jsonl
  observation_names: [x, y]
  action_names: [dx, dy]
  observation_units: meters
  action_units: meters
training:
  epochs: 2
  batch_size: 2
  learning_rate: 0.0005
  seed: 42
runtime:
  device: cpu
  precision: fp32
  num_threads: 1
