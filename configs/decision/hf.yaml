# Replace the sample file with your own domain data before a real experiment.
model:
  provider: hf
  id: google-bert/bert-base-multilingual-cased
  subfolder: null
  revision: null  # Resolved Hub revision is recorded in environment.json.
  max_len: 512
  head_max_len: 192
  encoding: pair
  head: independent
  decoder: typed
  pooling: mean
  head_hidden_size: null
  dropout: 0.1
  freeze_encoder: false
data:
  path: data/sample/decision/triage.jsonl
  tasks: configs/decision/tasks/triage.json
  reject_truncation: true
training:
  optimizer: adamw
  epochs: 2
  batch_size: 2
  gradient_accumulation: 8
  encoder_lr: 0.000025
  head_lr: 0.0001
  weight_decay: 0.01
  max_grad_norm: 1.0
  loss: supervised  # CE for all types, plus ordinal loss for score.
  ordinal_weight: 1.0
  rl_weight: 1.0
  ce_weight: 1.0
  noise_samples: 4
  sigma_start: 0.4
  sigma_end: 0.1
  gradient_checkpointing: true
  seed: 42
runtime:
  device: auto
  precision: fp32  # CUDA may use fp16/bf16; CPU and MPS use fp32.
  num_threads: 2
evaluation:
  selection_metric: nll
  include_baseline: true
calibration:
  enabled: true
output_dir: outputs/decision/hf
