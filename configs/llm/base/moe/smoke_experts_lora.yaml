model:
  id: tiny-olmoe
  architecture: moe
  dtype: float32
  max_len: 128
  max_weight_memory_gb: 0.01
data:
  samples: data/sample/llm/base.jsonl
  reject_truncation: false
training:
  method: lora
  moe_train_router: false
  moe_aux_loss_coef: 0.01
  epochs: 2
  batch_size: 2
  gradient_accumulation: 2
  learning_rate: 0.003
  gradient_checkpointing: false
  seed: 42
  lora_rank: 4
  lora_alpha: 8
  lora_target_modules: [q_proj, v_proj]
  lora_target_parameters: [mlp.experts.gate_up_proj, mlp.experts.down_proj]
runtime:
  device: cpu
  precision: fp32
  num_threads: 1
evaluation:
  selection_metric: nll
generation:
  max_new_tokens: 8
  do_sample: false
output_dir: outputs/llm/base/moe-smoke-experts-lora
