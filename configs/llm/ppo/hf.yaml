model:
  id: Qwen/Qwen2.5-0.5B-Instruct
  max_len: 1024
data:
  samples: data/local/ppo.jsonl
training:
  method: full
  epochs: 2
  batch_size: 2
  learning_rate: 0.0005
  weight_decay: 0.0
  seed: 42
runtime:
  device: cuda
  precision: fp32
  num_threads: 2
algorithm:
  max_new_tokens: 64
  update_epochs: 2
  minibatch_size: 2
  kl_coefficient: 0.05
  value_coefficient: 0.5
reward:
  exact_match_weight: 1.0
  token_overlap_weight: 1.0
  length_weight: 0.2
  target_length: 4
generation:
  max_new_tokens: 64
output_dir: outputs/llm/ppo/hf
