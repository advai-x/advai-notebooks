model:
  id: BAAI/bge-reranker-base
  revision: null
  max_len: 512
data:
  corpus: data/local/retrieval/corpus.jsonl
  queries: data/local/retrieval/queries.jsonl
  qrels: data/local/retrieval/qrels.jsonl
  allow_unjudged_negatives: false
  enforce_document_groups: false
  reject_truncation: true
  training_samples: data/local/retrieval/prepared/ranker_samples.json
  candidates: data/local/retrieval/prepared/candidates.json
training:
  optimizer: adamw
  epochs: 3
  batch_size: 8
  gradient_accumulation: 4
  learning_rate: 2.0e-05
  loss: bce
  gradient_checkpointing: true
runtime:
  device: auto
  precision: fp32
evaluation:
  cutoffs:
  - 1
  - 5
  - 10
  - 50
  - 100
  selection_metric: ndcg@10
output_dir: outputs/ranker/bge
