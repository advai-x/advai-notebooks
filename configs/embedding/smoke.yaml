model:
  id: tiny
  max_len: 64
  pooling: mean
data:
  enforce_document_groups: true
  training_samples: data/sample/retrieval/embedding_samples.json
training:
  optimizer: adamw
  epochs: 2
  batch_size: 4
  learning_rate: 0.001
  loss: mnrl
runtime:
  device: cpu
retrieval:
  top_k: 10
  corpus_chunk_size: 4
  query_chunk_size: 2
evaluation:
  cutoffs:
  - 1
  - 3
  - 5
  - 10
  selection_metric: mrr@3
output_dir: outputs/embedding/smoke
